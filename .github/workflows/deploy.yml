name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# The frontend now lives in frontend/ (monorepo layout), so every Node step
# runs with that as its working directory.
defaults:
  run:
    working-directory: frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack and install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build Vite App
        env: # ✅ mark build as GitHub Pages
          GITHUB_PAGES: true
          VITE_GITHUB_PAGES: true
        run: |
          pnpm run build
          cp dist/index.html dist/404.html

      - name: Deploy to GitHub Pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4.6.8
        with:
          branch: gh-pages
          folder: frontend/dist # action paths are repo-root relative
          token: ${{ secrets.GITHUB_TOKEN }}
