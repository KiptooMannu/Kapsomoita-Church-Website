<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2f3e9e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Kapsomoita Church · A welcoming family of faith</title>
    <meta
      name="description"
      content="Kapsomoita Church — a welcoming family of faith. Join us for worship, explore our ministries, watch sermons and grow with us."
    />

    <script>
      /*
       * Applies the stored theme before the first paint.
       *
       * This runs synchronously in <head>, ahead of React, which is what prevents
       * the flash of light theme a dark-mode user would otherwise see on every page
       * load. ThemeProvider reads the same key and takes over from here.
       *
       * Wrapped in try/catch because localStorage throws in Safari private mode, and
       * a failure here must not block the document from parsing.
       */
      (function () {
        try {
          var stored = localStorage.getItem('kapsomoita-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var isDark =
            stored === 'dark' || ((stored === null || stored === 'system') && prefersDark)
          if (isDark) {
            document.documentElement.classList.add('dark')
            document.documentElement.style.colorScheme = 'dark'
          }
        } catch (e) {
          /* fall through to the light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
